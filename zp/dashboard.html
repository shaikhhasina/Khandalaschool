<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Adarsh Vidyalaya</title>
<link rel="icon" href="assets/zp-logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dash-shell">
  <aside class="dash-sidebar">
    <div class="brand">
      <img src="assets/zp-logo.png" alt="logo">
      <span class="brand-name" style="color:#fff;">Adarsh Vidyalaya<span>Admin Panel</span></span>
    </div>
    <nav class="dash-nav">
      <a href="#" class="active">📋 Enquiries</a>
      <a href="index.html">🌐 View Website</a>
      <a href="#" id="logoutLink">🚪 Log Out</a>
    </nav>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <div>
        <h1>Admission Enquiries</h1>
        <p style="margin:0;">Signed in as <strong id="userEmail">—</strong></p>
      </div>
      <a href="index.html" class="btn btn-maroon">View Live Site</a>
    </div>

    <div class="dash-cards">
      <div class="dash-card"><div class="num" id="totalCount">0</div><div class="lbl">Total Enquiries</div></div>
      <div class="dash-card"><div class="num" id="newCount">0</div><div class="lbl">New (Unreviewed)</div></div>
      <div class="dash-card"><div class="num" id="todayCount">0</div><div class="lbl">Received Today</div></div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Student</th>
            <th>Parent</th>
            <th>Mobile</th>
            <th>Class</th>
            <th>Message</th>
            <th>Status</th>
            <th>Received</th>
          </tr>
        </thead>
        <tbody id="enquiryRows">
          <tr><td colspan="7" class="empty-row">Loading enquiries…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
